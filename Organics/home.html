<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rakesh Organics</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        /* Main container */
        .hero {
            width: 100%;
            height: 100vh;

            position: relative;

            overflow: hidden;
        }


        /* Background image */
        .hero-image {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* Dark overlay */
        .overlay {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.35);

            z-index: 2;
        }


        /* Text and buttons */
        .hero-content {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 1100px;

            text-align: center;

            color: white;

            z-index: 3;
        }


        /* Heading */
        .hero-content h1 {
            font-family: Georgia, "Times New Roman", serif;

            font-size: 75px;

            line-height: 1.05;

            margin-bottom: 35px;

            text-shadow: 2px 3px 5px black;
        }


        /* Paragraph */
        .hero-content p {
            font-family: Arial, sans-serif;

            font-size: 20px;

            line-height: 1.7;

            max-width: 1000px;

            margin: 0 auto 45px auto;

            text-shadow: 1px 2px 4px black;
        }


        /* Buttons */
        .buttons {
            display: flex;

            justify-content: center;

            gap: 30px;
        }


        .buttons button {
            padding: 18px 45px;

            font-size: 18px;

            border-radius: 15px;

            cursor: pointer;
        }


        /* First button */
        .hbtn1 {
            background-color: #3f654d;

            color: white;

            border: 2px solid #3f654d;
        }


        /* Second button */
        .hbtn2 {
            background-color: transparent;

            color: white;

            border: 2px solid white;
        }


        /* Explore */
        .explore {
            margin-top: 20px;

            font-size: 18px;

            color: white;
        }


        /* Mobile */
        @media (max-width: 768px) {

            .hero-content h1 {
                font-size: 45px;
            }

            .hero-content p {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;

                align-items: center;
            }

            .buttons button {
                width: 250px;
            }
        }

    </style>

</head>


<body>

    <div class="hero">

        <!-- BACKGROUND IMAGE -->
        <img
            class="hero-image"
            src="./Assets/logo.avif"
            alt="Organic Farm"
        >

        <!-- DARK OVERLAY -->
        <div class="overlay"></div>


        <!-- TEXT ON IMAGE -->
        <div class="hero-content">

            <h1>
                Pure. Fresh.<br>
                Unforgotten.
            </h1>

            <p>
                Experience the earth’s whisper in every bite.
                Our heirloom veggies and sun-ripened fruits are
                tended by hand, delivered with the morning dew still
                clinging.
                No shortcuts, just soil-deep flavor for your table.
            </p>


            <div class="buttons">

                <button class="hbtn1">
                    Discover the Bounty
                </button>

                <button class="hbtn2">
                    Our Story
                </button>

            </div>


            <div class="explore">
                Explore below
            </div>

        </div>

    </div>

</body>

</html>
